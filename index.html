.body a{color:var(--accent)}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.stat{background:var(--badge);border-radius:8px;padding:4px 10px;font-size:12.5px}
.stat b{font-weight:600}

const list = document.getElementById('list');
const chipsEl = document.getElementById('chips');
const qEl = document.getElementById('q');
let curCat = '全部';
const cats = ['全部', ...new Set(POSTS.map(p=>p.category))];
cats.forEach(c=>{const b=document.createElement('button');b.className='chip'+(c==='全部'?' on':'');b.textContent=c;b.onclick=()=>{curCat=c;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x.textContent===c));render();};chipsEl.appendChild(b);});
qEl.addEventListener('input', render);
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(s){return esc(s).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');}
function dayLabel(dstr){
  const now = new Date(); const tz = new Date(now.toLocaleString('en-US',{timeZone:'Asia/Shanghai'}));
  const today = tz.toISOString().slice(0,10);
  const y = new Date(tz.getTime()-86400000).toISOString().slice(0,10);
  if(dstr===today) return '今天 · '+dstr;
  if(dstr===y) return '昨天 · '+dstr;
  const d = new Date(dstr+'T00:00:00+08:00');
  return dstr + ' ' + '周日周一周二周三周四周五周六'[d.getDay()];
}
function render(){
  const q = qEl.value.trim();
  const items = POSTS.filter(p => (curCat==='全部'||p.category===curCat) && (!q || (p.title+p.body+p.kicker).includes(q)));
  if(!items.length){ list.innerHTML = '<div class="empty">没有符合条件的动态</div>'; return; }
  let html='', lastDay='';
  for(const p of items){
    if(p.date!==lastDay){ html += '<div class="day">'+dayLabel(p.date)+'</div>'; lastDay=p.date; }
    html += '<article class="card"><div class="meta"><span class="kicker">'+esc(p.kicker)+'</span><span class="cat">'+esc(p.category)+'</span>'+(p.idea?'<span class="idea">💡 想法</span>':'')+'</div>'
      + '<h2>'+esc(p.title)+'</h2><div class="body">'+md(p.body)+'</div>'
      + (p.stats&&p.stats.length ? '<div class="stats">'+p.stats.map(s=>'<span class="stat">'+esc(s.label)+'：<b>'+esc(s.value)+'</b></span>').join('')+'</div>' : '')
      + '<div class="why">为什么看到这条：'+esc(p.why)+'</div></article>';
  }
  list.innerHTML = html;
}
render();
